name: Security branch CI

on:
  push:
    branches:
      - main
      - "security/**"
      - "integration/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      SUPABASE_SECRET_KEY: sb_secret_test
      STAFF_DASHBOARD_PASSWORD: ci-staff-password
      MANAGER_DASHBOARD_PASSWORD: ci-manager-password

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify recovery, invite, and MFA security contracts
        run: node --test scripts/auth-security-contract.test.mjs
      - name: Verify multi-tenant security contracts
        run: node --test scripts/tenant-security-contract.test.mjs
      - name: Verify Rio login layout contracts
        run: node --test scripts/rio-auth-layout.test.mjs
      - name: Verify Rio dashboard design and preserved business actions
        run: node --test scripts/rio-dashboard-layout.test.mjs
      - name: Verify QR ordering security and reporting contracts
        run: node --test scripts/qr-orders-contract.test.mjs
      - name: Verify login performance and routing contracts
        run: node --test scripts/login-reliability.test.mjs
      - name: Check management analytics permissions and chart contracts
        run: node --test scripts/management-analytics-contract.test.mjs
      - name: Verify staff password-only role-based security contracts
        run: node --test scripts/staff-password-login-security.test.mjs
      - name: Verify category management and financial reporting links
        run: node --test scripts/rio-menu-ordering-and-stats.test.mjs
      - name: Verify management links never redirect to staff
        run: node --test scripts/management-routing-contract.test.mjs
      - name: Verify QR payment readiness, tenant security and disabled checkout
        run: node --test scripts/qr-payment-readiness-contract.test.mjs
      - run: npm run lint
      - run: npm run build
      - name: Block high-severity production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify bounded development advisory exception tests
        run: node --test scripts/check-development-audit.test.mjs
      - name: Audit development dependencies (block new critical/high findings)
        run: |
          # npm exits nonzero for advisories. Preserve the JSON report, then
          # enforce the EXACT known GHSA and transitive dependency chain.
          # Unknown advisories, malformed reports and expired exceptions fail.
          npm audit --json --audit-level=high > "$RUNNER_TEMP/rio-audit.json" || true
          node scripts/check-development-audit.mjs "$RUNNER_TEMP/rio-audit.json"
