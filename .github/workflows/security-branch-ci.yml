name: Security branch CI

on:
  push:
    branches:
      - main
      - "security/**"
      - "integration/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      SUPABASE_SECRET_KEY: sb_secret_test
      STAFF_DASHBOARD_PASSWORD: ci-staff-password
      MANAGER_DASHBOARD_PASSWORD: ci-manager-password

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify recovery, invite, and MFA security contracts
        run: node --test scripts/auth-security-contract.test.mjs
      - name: Verify multi-tenant security contracts
        run: node --test scripts/tenant-security-contract.test.mjs
      - name: Verify public reservation contracts
        run: node --test scripts/public-reservation-contract.test.mjs
      - run: npm run lint
      - run: npm run build
      - name: Block high-severity production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Strictly audit all dependencies including development tools
        run: npm audit --audit-level=high
