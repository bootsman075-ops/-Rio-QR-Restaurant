<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rio QR – uitnodiging</title>
</head>
<body style="margin:0;padding:32px;background:#f3efe5;color:#171714;font:16px/1.6 Arial,sans-serif">
  <div style="max-width:520px;margin:auto;padding:32px;background:#fffdf8;border-radius:20px">
    <h1 style="font-size:26px">Je bent uitgenodigd voor Rio QR</h1>
    <p>Er is een persoonlijk restaurantaccount voor jou aangevraagd.</p>
    <p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=invite"
      style="display:inline-block;padding:12px 18px;background:#171714;color:#ffffff;text-decoration:none;border-radius:10px">Account activeren</a></p>
    <p>Deze persoonlijke uitnodiging is eenmalig en alleen voor jou.</p>
    <p>Herken je deze uitnodiging niet? Negeer deze e-mail. Deel de link nooit met anderen.</p>
  </div>
</body>
</html>
